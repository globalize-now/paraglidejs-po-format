name: CI

# Matrix checks run on PRs. Pushes to main are handled by release.yml (which runs the
# same checks before publishing), so we don't duplicate the matrix on main here.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All currently-supported Node lines: 22 & 24 (LTS, 24 is latest), 26 (Current).
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
